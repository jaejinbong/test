<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>가을이하늘이 맞추기 - 가을이 vs 하늘이</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            position: relative;
            overflow: visible;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
        }
        
        /* 게임 화면에서 헤더와 인디케이터를 중앙 카드로부터 24px 위에 배치 */
        .game-screen .header {
            position: absolute;
            top: calc(50% - 160px); /* 카드 중심에서 160px 위 (24px 더 아래로) */
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            margin-bottom: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header .subtitle {
            font-size: 16px;
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .progress {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #4CAF50;
            transform: scale(1.2);
        }

        .progress-dot.completed {
            background: white;
        }

        .game-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            overflow: visible;
            width: 100vw;
            margin-left: -15px;
            margin-right: -15px;
        }

        .drop-zones {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            z-index: 1;
        }

        .drop-zone {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
            border-radius: 20px;
            margin: 10px;
        }

        body.left-active {
            background: #8B4513 !important;
            transition: background 0.3s ease;
        }

        body.right-active {
            background: #87CEEB !important;
            transition: background 0.3s ease;
        }

        body.neutral {
            background: #000000 !important;
            transition: background 0.3s ease;
        }

        .side-labels {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 240px;
            z-index: 5;
            pointer-events: none;
            width: auto;
        }

        .side-label {
            font-size: 16px;
            font-weight: 700;
            color: white;
            text-shadow: 0 3px 6px rgba(0,0,0,0.8);
            opacity: 1;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            white-space: nowrap;
        }

        .photo-card {
            width: 200px;
            height: 250px;
            background: #2C2C2C;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: absolute;
            z-index: 10;
            cursor: grab;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            will-change: transform;
            transform: translate(-50%, -50%) scale(1.0);
            left: 50%;
            top: 50%;
        }

        .photo-card:active {
            cursor: grabbing;
        }

        .photo-card.dragging {
            z-index: 20;
            transition: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .photo-container {
            width: 100%;
            height: 100%;
            background: #2C2C2C;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #666;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 20px;
        }

        .photo-placeholder {
            text-align: center;
            line-height: 1.4;
            background-color: #2C2C2C;
            color: #A5A5A5;
        }


        .results-screen {
            display: none;
            text-align: center;
            color: white;
            padding: 15px;
            position: relative;
            z-index: 20;
            background: #000000;
            height: 100vh;
            overflow-y: auto;
        }

        .results-content {
            min-height: calc(100vh - 30px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 80px;
            transition: justify-content 0.3s ease;
        }

        @media (max-height: 600px) {
            .results-content {
                justify-content: flex-start;
                padding-top: 20px;
            }
        }

        .results-screen.active {
            display: block;
        }

        .results-screen.active ~ .header {
            display: none;
        }

        .score-display {
            padding: 0;
            margin-bottom: 20px;
            width: 100%;
        }

        .score-display h2 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .score-display p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
        }

        .dashboard {
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            text-align: center;
        }

        .score-ranking {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ranking-group {
            border-radius: 12px;
            padding: 12px;
        }

        .ranking-group-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
            padding-bottom: 8px;
        }

        .ranking-item {
            padding: 4px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            border-radius: 8px;
        }

        .nicknames-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .nickname-item {
            white-space: nowrap;
        }

        .ranking-item:last-child {
            margin-bottom: 0;
        }

        .ranking-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ranking-emoji {
            font-size: 24px;
        }

        .ranking-score {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .ranking-nickname {
            font-size: 16px;
            font-weight: 500;
            color: #FFD700;
        }

        .ranking-time {
            font-size: 14px;
            opacity: 0.7;
            color: white;
        }

        .emoji-particle {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            user-select: none;
            animation: fall 2s ease-out forwards;
        }

        @keyframes fall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(300px) rotate(360deg);
            }
        }

        .emoji-particle.dissolve {
            animation: dissolve 0.3s ease-out forwards;
        }

        @keyframes dissolve {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        .restart-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 18px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.1);
            font-family: 'Roboto', sans-serif;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            white-space: nowrap;
            width: auto;
            display: inline-block;
        }

        .restart-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(-50%) translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .restart-btn:active {
            transform: translateX(-50%) translateY(0);
        }

        .date-display {
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        /* Loading Screen Styles */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        
        .loading-screen.hidden {
            display: none;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .loading-progress {
            font-size: 14px;
            opacity: 0.7;
        }

        /* Nickname Screen Styles */
        .nickname-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nickname-screen .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .nickname-screen .header {
            margin-bottom: 30px;
        }
        
        .nickname-screen .header h1 {
            font-size: 32px;
        }

        .video-container {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .intro-video {
            width: 200px;
            height: 200px;
            border-radius: 40px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .nickname-input-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .nickname-input {
            width: 100%;
            max-width: 300px;
            padding: 20px 0;
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 400;
            text-align: center;
            outline: none;
        }

        .nickname-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
        }

        .start-button-area {
            width: 100%;
            max-width: 300px;
        }

        .start-btn {
            width: auto;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 18px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.1);
            font-family: 'Roboto', sans-serif;
        }

        .start-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .start-btn:disabled {
            background: rgba(255, 255, 255, 0.3);
            color: rgba(0, 0, 0, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }


        .game-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: visible;
        }

        .game-screen .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: visible;
        }

        .game-screen .header {
            margin-bottom: 15px;
            position: absolute;
            top: calc(50% - 280px);
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            text-align: center;
            width: 100%;
            white-space: nowrap;
        }

        .results-screen .header {
            position: static;
            transform: none;
            width: 100%;
            margin: 0 auto 12px auto;
            white-space: normal;
            padding: 0 20px;
            text-align: center;
        }
        
        .results-screen .header h1 {
            font-size: 32px;
        }

        .results-screen .header .subtitle {
            font-size: 40px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .photo-card {
                width: 180px;
                height: 225px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .side-labels {
                gap: 160px;
            }
            
            .game-area {
                min-height: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen hidden" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">이미지를 로드하는 중...</div>
        <div class="loading-progress" id="loadingProgress">0/0</div>
    </div>

    <!-- Nickname Input Screen -->
    <div class="nickname-screen" id="nicknameScreen">
        <div class="container">
            <div class="video-container">
                <video class="intro-video" autoplay muted loop playsinline>
                    <source src="jeju_twins.mov" type="video/mp4">
                    <source src="jeju_twins.mov" type="video/quicktime">
                    비디오를 재생할 수 없습니다.
                </video>
            </div>
            
            <div class="header">
                <h1>가을 하늘 맞추기</h1>
            </div>
            
            <div class="nickname-input-area">
                <input type="text" id="nicknameInput" class="nickname-input" placeholder="닉네임을 입력해주세요" maxlength="10">
            </div>
            
            <div class="start-button-area">
                <button class="start-btn" id="startBtn" onclick="startGame()">시작하기</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div class="game-screen" id="gameScreen" style="display: none;">
        <div class="container">
            <div class="header">
                <p class="subtitle" id="gameProgress">1/12</p>
                <h1>이 아기는 누구?</h1>
            </div>

            <div class="game-area" id="gameArea">
            <div class="drop-zones">
                <div class="drop-zone" id="leftZone" data-answer="가을"></div>
                <div class="drop-zone" id="rightZone" data-answer="하늘"></div>
            </div>
            
            <div class="side-labels">
                <div class="side-label">가을</div>
                <div class="side-label">하늘</div>
            </div>

            <div class="photo-card" id="photoCard">
                <div class="photo-container">
                    <div class="photo-placeholder">
                        📸<br>
                        사진을 로드하고 있어요.<br>
                        잠시만 기다려주세요.
                    </div>
                </div>
            </div>
            </div>

            <div class="results-screen" id="resultsScreen">
                <div class="results-content">
                    <div class="header">
                        <h1 id="dynamicTitle">가을하늘 랭킹</h1>
                    </div>
                    
                    <div class="score-display">
                        <p id="scoreMessage">결과가 저장되었습니다!</p>
                    </div>

                    <div class="dashboard">
                        <div class="score-ranking" id="scoreRanking">
                            <!-- 순위별 결과가 여기에 표시됩니다 -->
                        </div>
                    </div>
                </div>

                <button class="restart-btn" onclick="restartGame()">다시 도전하기</button>
            </div>
        </div>
    </div>

    <script>
        // 기본 변수
        let playerNickname = '';
        let gameInstance = null;
        
        // 기본 초기화
        console.log('📝 JavaScript 스크립트 로드 시작');
        
        async function startGame() {
            console.log('🎯 Start button clicked!');
            const nickname = document.getElementById('nicknameInput').value.trim();
            
            if (nickname === '') {
                alert('닉네임을 입력해주세요!'); // 이건 유지 (사용자 안내용)
                return;
            }
            
            playerNickname = nickname;
            console.log('👤 Nickname set:', playerNickname);
            
            // 글로벌 랭킹 데이터 로드 (백그라운드)
            fetch('https://jaejinbong.github.io/test/rankings.json')
                .then(response => response.json())
                .then(rankings => {
                    localStorage.setItem('global_rankings', JSON.stringify(rankings));
                    localStorage.setItem('global_rankings_updated', new Date().toISOString());
                    console.log('📊 글로벌 랭킹 로드 완료:', rankings.length, '개');
                })
                .catch(error => console.log('📊 글로벌 랭킹 로드 실패 (정상):', error));
            
            // 화면 전환
            document.getElementById('nicknameScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('gameArea').style.display = 'flex';
            document.getElementById('resultsScreen').classList.remove('active');
            document.querySelector('.game-screen .header').style.display = 'block';
            
            // 배경 초기화
            document.body.classList.remove('left-active', 'right-active');
            document.body.classList.add('neutral');
            
            console.log('📺 Screen switched to game');
            
            // 간단한 게임 인스턴스 생성
            gameInstance = new SimpleGame();
            await gameInstance.start();
        }
        
        function restartGame() {
            console.log('🔄 Restarting game...');
            
            // 게임 인스턴스 완전히 정리
            if (gameInstance) {
                console.log('🧹 Cleaning up previous game instance...');
                // 이전 게임의 이벤트 리스너 정리
                if (typeof gameInstance.cleanup === 'function') {
                    gameInstance.cleanup();
                }
                gameInstance = null;
                console.log('✅ Previous game instance destroyed');
            }
            
            // 화면 전환
            document.getElementById('nicknameScreen').style.display = 'flex';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('resultsScreen').classList.remove('active');
            
            // 전역 상태 초기화
            playerNickname = '';
            
            // 닉네임 입력 초기화
            const nicknameInput = document.getElementById('nicknameInput');
            const startBtn = document.getElementById('startBtn');
            nicknameInput.value = '';
            startBtn.disabled = true;
            
            // 닉네임 입력 이벤트 재설정
            setupNicknameInput();
            
            // 포커스 설정
            setTimeout(() => {
                nicknameInput.focus();
                console.log('✅ Restart complete, input focused');
            }, 100);
        }
        
        // 간단한 게임 클래스
        class SimpleGame {
            constructor() {
                this.currentQuestion = 0;
                this.score = 0;
                this.questions = [];
                this.isDragging = false;
                this.startX = 0;
                this.startY = 0;
                this.currentX = 0;
                this.currentY = 0;
                
                this.photoCard = document.getElementById('photoCard');
                this.gameArea = document.getElementById('gameArea');
                
                // 이벤트 핸들러를 바인딩하여 저장 (나중에 제거할 수 있도록)
                this.boundHandleStart = this.handleStart.bind(this);
                this.boundHandleMove = this.handleMove.bind(this);
                this.boundHandleEnd = this.handleEnd.bind(this);
                
                console.log('🎮 SimpleGame initialized');
            }
            
            async start() {
                console.log('🚀 Starting simple game');
                
                // 게임 상태 초기화
                this.currentQuestion = 0;
                this.score = 0;
                this.questions = []; // 명시적으로 빈 배열로 초기화
                console.log('🔄 Game state reset - currentQuestion:', this.currentQuestion, 'score:', this.score, 'questions cleared');
                
                // 사진 로드
                console.log('📸 About to load photos...');
                await this.loadAvailablePhotos();
                console.log('📸 Photos loaded, generating questions...');
                
                this.generateQuestions();
                console.log('✅ Questions generation complete. Total questions:', this.questions.length);
                
                // 생성된 문제들을 확인
                console.log(`🔍 GAME START DEBUG: Generated ${this.questions.length} questions, currentQuestion=${this.currentQuestion}, score=${this.score}`);
                if (this.questions.length < 12) {
                    console.error('❌ ERROR: Only', this.questions.length, 'questions generated! Expected 12');
                } else {
                    console.log('✅ Correct: 12 questions generated');
                }
                
                this.setupDragAndDrop();
                this.loadQuestion();
            }
            
            generateQuestions() {
                console.log('🎲 Generating questions with photos...');
                
                // 기존 문제들 초기화
                this.questions = [];
                console.log('🔄 Questions array cleared');
                
                if (!this.availablePhotos) {
                    console.warn('⚠️ No photos available, using placeholders');
                    // 폴백: 사진이 없으면 기본 문제 생성
                    for (let i = 0; i < 12; i++) {
                        const babies = ['가을', '하늘'];
                        const randomBaby = babies[Math.floor(Math.random() * babies.length)];
                        this.questions.push({
                            baby: randomBaby,
                            description: `${i + 1}번째 문제`,
                            imagePath: null
                        });
                    }
                    return;
                }
                
                // 사진이 있으면 사진과 함께 문제 생성
                const allAvailableImages = [];
                const babies = ['가을', '하늘'];
                
                babies.forEach(baby => {
                    const images = this.availablePhotos[baby] || [];
                    images.forEach(imagePath => {
                        allAvailableImages.push({ baby, imagePath });
                    });
                });
                
                console.log('📊 Total available images:', allAvailableImages.length);
                console.log('📊 Available photos by baby:', {
                    '가을': this.availablePhotos['가을'].length,
                    '하늘': this.availablePhotos['하늘'].length
                });
                
                // 사진이 너무 적으면 강제로 12개 플레이스홀더 생성
                if (allAvailableImages.length < 12) {
                    console.warn('⚠️ Not enough images, creating placeholders for 12 questions');
                    for (let i = 0; i < 12; i++) {
                        const randomBaby = babies[Math.floor(Math.random() * babies.length)];
                        this.questions.push({
                            baby: randomBaby,
                            description: `${i + 1}번째 문제`,
                            imagePath: allAvailableImages[i % allAvailableImages.length]?.imagePath || null
                        });
                    }
                    console.log('🎲 Generated', this.questions.length, 'placeholder questions');
                    return;
                }
                
                // 12개 문제 생성 (중복 없이)
                const usedImages = new Set();
                
                for (let i = 0; i < 12; i++) {
                    if (allAvailableImages.length === 0) {
                        // 사진이 없으면 플레이스홀더
                        const randomBaby = babies[Math.floor(Math.random() * babies.length)];
                        this.questions.push({
                            baby: randomBaby,
                            description: `${i + 1}번째 문제`,
                            imagePath: null
                        });
                        continue;
                    }
                    
                    // 사용되지 않은 이미지 찾기
                    const unusedImages = allAvailableImages.filter(img => !usedImages.has(img.imagePath));
                    
                    if (unusedImages.length === 0) {
                        // 모든 이미지를 사용했으면 순환 사용
                        usedImages.clear();
                    }
                    
                    const availableImages = unusedImages.length > 0 ? unusedImages : allAvailableImages;
                    const randomImageData = availableImages[Math.floor(Math.random() * availableImages.length)];
                    
                    usedImages.add(randomImageData.imagePath);
                    
                    this.questions.push({
                        baby: randomImageData.baby,
                        description: `${i + 1}번째 문제`,
                        imagePath: randomImageData.imagePath
                    });
                }
                
                console.log('🎲 Generated', this.questions.length, 'questions with photos');
            }
            
            async loadAvailablePhotos() {
                console.log('📸 Loading available photos...');
                
                this.availablePhotos = {
                    '가을': [],
                    '하늘': []
                };
                
                // 가을이 사진 로드 (1-50번 사진 검사)
                const extensions = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG'];
                
                for (let i = 1; i <= 50; i++) {
                    const baseName = `images/gaeul/gaeul_${i.toString().padStart(2, '0')}`;
                    for (const ext of extensions) {
                        const imagePath = `${baseName}.${ext}`;
                        if (await this.imageExists(imagePath)) {
                            this.availablePhotos['가을'].push(imagePath);
                            console.log('✅ 가을이 사진 발견:', imagePath);
                            break;
                        }
                    }
                }
                
                // 하늘이 사진 로드 (1-50번 사진 검사)
                for (let i = 1; i <= 50; i++) {
                    const baseName = `images/haneul/haneul_${i.toString().padStart(2, '0')}`;
                    for (const ext of extensions) {
                        const imagePath = `${baseName}.${ext}`;
                        if (await this.imageExists(imagePath)) {
                            this.availablePhotos['하늘'].push(imagePath);
                            console.log('✅ 하늘이 사진 발견:', imagePath);
                            break;
                        }
                    }
                }
                
                console.log('🎆 로드된 사진 총개수:', {
                    '가을': this.availablePhotos['가을'].length,
                    '하늘': this.availablePhotos['하늘'].length
                });
                
                // 총 사진 수 체크
                const totalPhotos = this.availablePhotos['가을'].length + this.availablePhotos['하늘'].length;
                console.log('📊 총 사진 수:', totalPhotos);
                
                if (totalPhotos === 0) {
                    console.warn('⚠️ 사진이 전혀 발견되지 않았습니다!');
                } else if (totalPhotos < 12) {
                    console.warn(`⚠️ 사진이 ${totalPhotos}개만 발견되었습니다. 12개 문제를 위해 순환 사용됩니다.`);
                }
            }
            
            imageExists(imagePath) {
                return new Promise((resolve) => {
                    const img = new Image();
                    
                    const timeout = setTimeout(() => {
                        resolve(false);
                    }, 3000);
                    
                    img.onload = () => {
                        clearTimeout(timeout);
                        console.log('✅ Image loaded successfully:', imagePath);
                        resolve(true);
                    };
                    
                    img.onerror = (error) => {
                        clearTimeout(timeout);
                        console.log('❌ Image failed to load:', imagePath, error);
                        resolve(false);
                    };
                    
                    // img.crossOrigin = 'anonymous'; // 로컬 파일의 경우 CORS 제거
                    img.src = imagePath;
                });
            }
            
            setupDragAndDrop() {
                console.log('🔧 Setting up drag and drop...');
                console.log('📋 PhotoCard element:', this.photoCard);
                
                if (!this.photoCard) {
                    console.error('❌ Photo card not found');
                    return;
                }
                
                console.log('✅ Photo card found, setting up events...');
                
                // 터치 이벤트 (바인딩된 핸들러 사용)
                this.photoCard.addEventListener('touchstart', this.boundHandleStart);
                this.photoCard.addEventListener('touchmove', this.boundHandleMove);
                this.photoCard.addEventListener('touchend', this.boundHandleEnd);
                
                // 마우스 이벤트 (데스크톱 테스트용)
                this.photoCard.addEventListener('mousedown', this.boundHandleStart);
                document.addEventListener('mousemove', this.boundHandleMove);
                document.addEventListener('mouseup', this.boundHandleEnd);
                
                // 테스트용 클릭 이벤트 (알람 없이 로그만)
                this.photoCard.addEventListener('click', () => {
                    console.log('👆 Photo card clicked!');
                });
                
                console.log('🔧 Drag and drop setup complete');
            }
            
            handleStart(e) {
                console.log('🔄 handleStart called:', e.type);
                e.preventDefault();
                this.isDragging = true;
                this.photoCard.classList.add('dragging');
                this.photoCard.style.transition = 'none';
                
                // 햄틱 피드백
                if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
                
                // 디버그 로그만 (alert 제거)
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                this.startX = clientX;
                this.startY = clientY;
                this.currentX = 0;
                this.currentY = 0;
                
                console.log('🔄 Drag started');
            }
            
            handleMove(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                this.currentX = clientX - this.startX;
                this.currentY = clientY - this.startY;
                
                const rotation = Math.max(-15, Math.min(15, this.currentX * 0.1));
                const limitedY = this.currentY * 0.3;
                
                requestAnimationFrame(() => {
                    this.photoCard.style.transform = `translate(-50%, -50%) translate3d(${this.currentX}px, ${limitedY}px, 0) rotate(${rotation}deg) scale(1.0)`;
                });
                
                // 배경색 변경
                document.body.classList.remove('left-active', 'right-active', 'neutral');
                
                if (this.currentX < -50) {
                    document.body.classList.add('left-active');
                } else if (this.currentX > 50) {
                    document.body.classList.add('right-active');
                } else {
                    document.body.classList.add('neutral');
                }
            }
            
            handleEnd(e) {
                if (!this.isDragging) return;
                
                this.isDragging = false;
                this.photoCard.classList.remove('dragging');
                
                const threshold = 80;
                let selectedAnswer = null;
                
                if (this.currentX < -threshold) {
                    selectedAnswer = '가을';
                    if (navigator.vibrate) {
                        navigator.vibrate(30);
                    }
                    this.animateCardExit('left');
                } else if (this.currentX > threshold) {
                    selectedAnswer = '하늘';
                    if (navigator.vibrate) {
                        navigator.vibrate(30);
                    }
                    this.animateCardExit('right');
                } else {
                    // 중앙으로 복귀
                    this.photoCard.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    this.photoCard.style.transform = 'translate(-50%, -50%) translate3d(0, 0, 0) rotate(0deg) scale(1.0)';
                    
                    document.body.classList.remove('left-active', 'right-active');
                    document.body.classList.add('neutral');
                    
                    setTimeout(() => {
                        this.photoCard.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    }, 400);
                    return;
                }
                
                if (selectedAnswer) {
                    console.log('🎯 Selected:', selectedAnswer);
                    
                    // 즉시 정답 체크
                    this.checkAnswer(selectedAnswer);
                    
                    // 이모지 효과
                    this.showEmojiExplosion(selectedAnswer);
                }
            }
            
            animateCardExit(direction) {
                const exitX = direction === 'left' ? -300 : 300;
                this.photoCard.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';
                this.photoCard.style.transform = `translate(-50%, -50%) translate3d(${exitX}px, -50px, 0) rotate(${exitX/10}deg) scale(0.8)`;
                this.photoCard.style.opacity = '0.3';
                
                setTimeout(() => {
                    this.nextQuestion();
                }, 300);
            }
            
            showEmojiExplosion(selectedAnswer) {
                const emojiMap = {
                    '가을': '🍁',
                    '하늘': '☁️'
                };
                
                const emoji = emojiMap[selectedAnswer] || '✨';
                const particleCount = Math.floor(Math.random() * 6) + 20; // 20~25개
                
                // 시작 위치 결정 (왼쪽 또는 오른쪽 끝)
                const startSide = selectedAnswer === '가을' ? 'left' : 'right';
                
                // 파티클들을 저장할 배열
                this.activeParticles = this.activeParticles || [];
                
                // 폭발적으로 순차적 생성 (팡! 효과)
                for (let i = 0; i < particleCount; i++) {
                    setTimeout(() => {
                        this.createEmojiParticle(emoji, startSide);
                    }, i * 25); // 더 빠르게 순차적으로 나타남
                }
                
                console.log(`💥 Dynamic emoji explosion: ${emoji} x${particleCount}`);
            }
            
            createEmojiParticle(emoji, startSide) {
                const particle = document.createElement('div');
                particle.className = 'emoji-particle';
                particle.textContent = emoji;
                
                // 랜덤 크기 설정 (24px ~ 72px) - 더 화려하게
                const size = Math.floor(Math.random() * 48) + 24;
                particle.style.fontSize = `${size}px`;
                
                // 시작 위치 설정
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                let startX, endX;
                
                if (startSide === 'left') {
                    startX = -50; // 화면 왼쪽 밖
                    endX = Math.random() * (screenWidth * 0.7) + (screenWidth * 0.15); // 화면 중앙 쪽으로
                } else {
                    startX = screenWidth + 50; // 화면 오른쪽 밖
                    endX = Math.random() * (screenWidth * 0.7) + (screenWidth * 0.15); // 화면 중앙 쪽으로
                }
                
                const startY = Math.random() * (screenHeight * 0.3) + (screenHeight * 0.1); // 상단에서 시작
                const fallDistance = Math.random() * 300 + 400; // 400~700px 떨어짐
                
                // 초기 위치 설정
                particle.style.cssText = `
                    position: fixed;
                    left: ${startX}px;
                    top: ${startY}px;
                    font-size: ${size}px;
                    pointer-events: none;
                    z-index: 9999;
                    user-select: none;
                    transition: none;
                `;
                
                document.body.appendChild(particle);
                this.activeParticles.push(particle);
                
                // 애니메이션 시작 (수동으로 CSS transition 사용)
                requestAnimationFrame(() => {
                    particle.style.transition = `
                        left 2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        top 2s cubic-bezier(0.55, 0.085, 0.68, 0.53),
                        opacity 0.5s ease-out 1.5s,
                        transform 2s ease-out
                    `;
                    
                    // 최종 위치로 이동
                    particle.style.left = endX + 'px';
                    particle.style.top = (startY + fallDistance) + 'px';
                    
                    // 랜덤 회전 효과
                    const rotation = (Math.random() - 0.5) * 720; // -360도 ~ 360도
                    particle.style.transform = `rotate(${rotation}deg) scale(0.5)`;
                    
                    // 페이드아웃
                    particle.style.opacity = '0';
                });
                
                // 2.5초 후 제거
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                    const index = this.activeParticles.indexOf(particle);
                    if (index > -1) {
                        this.activeParticles.splice(index, 1);
                    }
                }, 2500);
            }
            
            checkAnswer(selectedAnswer) {
                const currentQ = this.questions[this.currentQuestion];
                const isCorrect = selectedAnswer === currentQ.baby;
                
                console.log('🤔 Answer check:', {
                    question: this.currentQuestion + 1,
                    imagePath: currentQ.imagePath,
                    correctAnswer: currentQ.baby,
                    selectedAnswer: selectedAnswer,
                    isCorrect: isCorrect
                });
                
                if (isCorrect) {
                    this.score++;
                    console.log('✅ Correct! Score:', this.score);
                } else {
                    console.log('❌ Wrong! Correct answer was:', currentQ.baby);
                }
            }
            
            nextQuestion() {
                this.currentQuestion++;
                console.log(`📈 Next question: ${this.currentQuestion}/${this.questions.length}`);
                console.log(`📊 Current progress: Question ${this.currentQuestion}, Score: ${this.score}`);
                console.log(`🔍 DEBUG: currentQuestion=${this.currentQuestion}, questions.length=${this.questions.length}, comparison result=${this.currentQuestion < this.questions.length}`);
                
                if (this.currentQuestion < this.questions.length) {
                    console.log('➡️ Loading next question');
                    setTimeout(() => {
                        this.loadQuestion();
                    }, 200);
                } else {
                    console.log(`🏁 Game finished! Final stats: ${this.score}/${this.questions.length} questions`);
                    console.log(`🚨 GAME END DEBUG: currentQuestion=${this.currentQuestion}, questions.length=${this.questions.length}`);
                    console.log('🏆 About to show results...');
                    setTimeout(() => {
                        this.showResults();
                    }, 800);
                }
            }
            
            loadQuestion() {
                if (this.currentQuestion < this.questions.length) {
                    const question = this.questions[this.currentQuestion];
                    
                    console.log(`🎯 Loading question ${this.currentQuestion + 1}:`, question.baby);
                    
                    // 진행 업데이트
                    const progressElement = document.getElementById('gameProgress');
                    if (progressElement) {
                        progressElement.textContent = `${this.currentQuestion + 1}/${this.questions.length}`;
                    }
                    
                    // 카드 재설정
                    this.photoCard.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    this.photoCard.style.transform = 'translate(-50%, -50%) translate3d(0, 0, 0) rotate(0deg) scale(1.0)';
                    this.photoCard.style.opacity = '1';
                    
                    // 플레이스홀더 표시
                    const photoContainer = this.photoCard.querySelector('.photo-container');
                    const placeholder = this.photoCard.querySelector('.photo-placeholder');
                    
                    // 기존 모든 이미지 제거
                    const existingImgs = photoContainer.querySelectorAll('img');
                    existingImgs.forEach(img => img.remove());
                    
                    // 이미지 로드 및 표시
                    if (question.imagePath) {
                        console.log('🖼️ Loading image:', question.imagePath);
                        
                        const img = new Image();
                        img.onload = () => {
                            console.log('✅ Image loaded successfully:', question.imagePath);
                            placeholder.style.display = 'none';
                            photoContainer.appendChild(img);
                        };
                        
                        img.onerror = () => {
                            console.error('❌ Failed to load image:', question.imagePath);
                            placeholder.style.display = 'flex';
                            placeholder.innerHTML = `📸<br>${question.description}<br>(이미지 로드 실패)`;
                        };
                        
                        // img.crossOrigin = 'anonymous'; // 로컬 파일의 경우 CORS 제거
                        img.src = question.imagePath;
                        
                        // 로딩 중 플레이스홀더 표시
                        placeholder.style.display = 'flex';
                        placeholder.innerHTML = `📸<br>사진을 로드하고 있어요.<br>잠시만 기다려주세요.`;
                        
                    } else {
                        // 이미지가 없으면 플레이스홀더 표시
                        placeholder.style.display = 'flex';
                        placeholder.innerHTML = `📸<br>사진을 로드하고 있어요.<br>잠시만 기다려주세요.`;
                    }
                    
                    // 배경 초기화
                    document.body.classList.remove('left-active', 'right-active');
                    document.body.classList.add('neutral');
                }
            }
            
            showResults() {
                console.log('🏆 Game finished! Final score:', this.score, '/', this.questions.length);
                
                // 게임 화면 숨기기
                this.gameArea.style.display = 'none';
                document.querySelector('.game-screen .header').style.display = 'none';
                document.getElementById('resultsScreen').classList.add('active');
                
                // 배경 초기화
                document.body.classList.remove('left-active', 'right-active');
                document.body.classList.add('neutral');
                
                // 기본 결과 표시
                const scoreMessage = document.getElementById('scoreMessage');
                if (scoreMessage) {
                    console.log('🏆 Final score display:', this.score, '/', this.questions.length);
                    scoreMessage.textContent = `${this.score}/${this.questions.length}개 맞추셨어요!`;
                }
                
                const dynamicTitle = document.getElementById('dynamicTitle');
                if (dynamicTitle) {
                    const scoreRatio = this.score / this.questions.length;
                    console.log('📊 Score ratio:', this.score, '/', this.questions.length, '=', scoreRatio);
                    if (scoreRatio >= 0.9) {
                        dynamicTitle.textContent = '어...엄마..? 😱';
                    } else if (scoreRatio >= 0.7) {
                        dynamicTitle.textContent = '도치 이모, 삼촌 인정! 👍';
                    } else if (scoreRatio >= 0.4) {
                        dynamicTitle.textContent = '한 번 방문하셔야겠어요...! 🏠';
                    } else {
                        dynamicTitle.textContent = '실망이에요..! 😞';
                    }
                }
                
                // 랭킹 데이터 저장 및 표시
                this.saveAndUpdateAsync();
            }

            cleanup() {
                console.log('🧹 Cleaning up game instance...');
                
                // 게임 상태 완전 초기화
                this.currentQuestion = 0;
                this.score = 0;
                this.questions = [];
                console.log('🔄 Game state reset - currentQuestion:', this.currentQuestion, 'score:', this.score, 'questions cleared');
                
                // 드래그앤드롭 이벤트 리스너 제거 (바인딩된 핸들러 사용)
                if (this.photoCard) {
                    this.photoCard.removeEventListener('touchstart', this.boundHandleStart);
                    this.photoCard.removeEventListener('touchmove', this.boundHandleMove);
                    this.photoCard.removeEventListener('touchend', this.boundHandleEnd);
                    this.photoCard.removeEventListener('mousedown', this.boundHandleStart);
                }
                
                // document 레벨 이벤트 리스너 제거
                document.removeEventListener('mousemove', this.boundHandleMove);
                document.removeEventListener('mouseup', this.boundHandleEnd);
                
                // 활성 파티클 정리
                if (this.activeParticles) {
                    this.activeParticles.forEach(particle => {
                        if (particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                        }
                    });
                    this.activeParticles = [];
                }
                
                // 타이머 정리 (만약 있다면)
                if (this.animationTimer) {
                    clearTimeout(this.animationTimer);
                }
                
                console.log('✅ Game cleanup complete');
            }
            
            async saveAndUpdateAsync() {
                try {
                    // 점수 저장
                    await this.saveScore();
                    
                    // 대시보드 업데이트
                    await this.updateDashboard();
                    
                } catch (error) {
                    console.error('📊 랭킹 데이터 처리 오류:', error);
                    // 오류 발생 시 로컬 데이터로만 업데이트
                    const localScores = JSON.parse(localStorage.getItem('all_scores')) || [];
                    this.displayRankings(localScores);
                }
            }
            
            async saveScore() {
                const currentTime = new Date().toISOString();
                const scoreEntry = {
                    nickname: playerNickname,
                    score: this.score,
                    time: currentTime
                };

                console.log('💾 Saving score:', scoreEntry);

                // 로컬 저장
                const localScores = JSON.parse(localStorage.getItem('all_scores')) || [];
                localScores.push(scoreEntry);
                localStorage.setItem('all_scores', JSON.stringify(localScores));
                console.log('💾 Local scores updated:', localScores.length, 'total scores');

                // GitHub Gist에 저장 시도
                try {
                    await this.saveScoreToGist(scoreEntry);
                    console.log('✅ 점수가 GitHub Gist에 저장되었습니다');
                } catch (error) {
                    console.warn('⚠️ GitHub Gist 저장 실패, 로컬에만 저장됨:', error);
                }
            }

            async saveScoreToGist(scoreEntry) {
                // GitHub Pages를 통해 공개된 rankings.json 파일 사용
                const rankingsUrl = 'https://jaejinbong.github.io/test/rankings.json';
                
                // 기존 데이터 로드
                let existingScores = [];
                try {
                    const response = await fetch(rankingsUrl);
                    if (response.ok) {
                        existingScores = await response.json();

                    if (position === 2) return '🥉';
                    return '';
                };

                // 유효한 점수 데이터만 필터링하고 정렬
                const validScores = allScores
                    .filter(entry => typeof entry === 'object' && entry.score !== undefined)
                    .sort((a, b) => {

                            return b.score - a.score;
                        }
                        return b.time.localeCompare(a.time);
                    });

                const rankingContainer = document.getElementById('scoreRanking');
                console.log('📋 Ranking container found:', !!rankingContainer);

                    return;
                }

                // 점수별로 그룹핑

                validScores.forEach(entry => {

                    }
                    groupedScores[entry.score].push(entry);
                });

                // 점수 내림차순으로 정렬된 키들

                rankingContainer.innerHTML = sortedScores.map((score, groupIndex) => {

                    `;

            }

            async preloadAllImages() {
                console.log('🚀 Starting image preloading...');
                
                // 게임에서 사용될 이미지들만 추출
                const imagesToPreload = this.questions
                    .map(q => q.imagePath)
                    .filter(path => path !== null);
                
                if (imagesToPreload.length === 0) {
                    console.log('📋 No images to preload, continuing with placeholders');
                    return;
                }
                
                const totalImages = imagesToPreload.length;
                let loadedImages = 0;
                
                // 로딩 진행률 업데이트
                this.updateLoadingProgress(loadedImages, totalImages);
                
                // 병렬로 이미지 프리로드 (최대 3개씩으로 줄여서 안정성 향상)
                const batchSize = 3;
                for (let i = 0; i < imagesToPreload.length; i += batchSize) {
                    const batch = imagesToPreload.slice(i, i + batchSize);
                    const promises = batch.map(async (imagePath) => {
                        try {
                            const img = await this.preloadImage(imagePath);
                            this.preloadedImages.set(imagePath, img);
                            loadedImages++;
                            this.updateLoadingProgress(loadedImages, totalImages);
                            console.log(`✅ Preloaded: ${imagePath} (${loadedImages}/${totalImages})`);
                            return true;
                        } catch (error) {
                            console.log(`❌ Failed to preload: ${imagePath}`, error);
                            loadedImages++;
                            this.updateLoadingProgress(loadedImages, totalImages);
                            return false;
                        }
                    });
                    
                    await Promise.all(promises);
                    
                    // 배치 간 짧은 지연으로 브라우저 부하 방지
                    if (i + batchSize < imagesToPreload.length) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                }
                
                console.log(`🎉 Preloading complete! ${this.preloadedImages.size}/${totalImages} images loaded`);
            }

            preloadImage(imagePath) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    
                    const timeout = setTimeout(() => {
                        reject(new Error('Preload timeout'));
                    }, 5000); // 5초 타임아웃으로 단축
                    
                    img.onload = () => {
                        clearTimeout(timeout);
                        resolve(img);
                    };
                    
                    img.onerror = () => {
                        clearTimeout(timeout);
                        reject(new Error('Failed to load image'));
                    };
                    
                    // img.crossOrigin = 'anonymous'; // 로컬 파일의 경우 CORS 제거
                    img.src = imagePath;
                });
            }

            updateLoadingProgress(loaded, total) {
                const progressElement = document.getElementById('loadingProgress');
                if (progressElement) {
                    progressElement.textContent = `${loaded}/${total}`;
                }
                
                // 로딩 화면은 수동으로만 제어 (자동 숨김 제거)
            }

                        // img.crossOrigin = 'anonymous'; // 로컬 파일의 경우 CORS 제거

                    } else {

            updateProgress() {
                const progressElement = document.getElementById('gameProgress');
                if (progressElement) {
                    progressElement.textContent = `${this.currentQuestion + 1}/12`;
                }
            }

            setupDragAndDrop() {
                // Touch events
                this.photoCard.addEventListener('touchstart', this.handleStart.bind(this));
                this.photoCard.addEventListener('touchmove', this.handleMove.bind(this));
                this.photoCard.addEventListener('touchend', this.handleEnd.bind(this));

                // Mouse events for desktop testing
                this.photoCard.addEventListener('mousedown', this.handleStart.bind(this));
                document.addEventListener('mousemove', this.handleMove.bind(this));
                document.addEventListener('mouseup', this.handleEnd.bind(this));
            }

            handleStart(e) {
                e.preventDefault();
                this.isDragging = true;
                this.photoCard.classList.add('dragging');
                this.photoCard.style.transition = 'none';
                
                // 햄틱 피드백 추가 (드래그 시작)
                if (navigator.vibrate) {
                    navigator.vibrate(10); // 10ms 짧은 진동
                }
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                this.startX = clientX;
                this.startY = clientY;
                this.currentX = 0;
                this.currentY = 0;
            }

            handleMove(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                this.currentX = clientX - this.startX;
                this.currentY = clientY - this.startY;
                
                // 더 부드러운 회전 효과 (최대 15도)
                const rotation = Math.max(-15, Math.min(15, this.currentX * 0.1));
                
                // 카드가 더 자연스럽게 따라오도록 Y축 움직임 제한
                const limitedY = this.currentY * 0.3;
                
                requestAnimationFrame(() => {
                    this.photoCard.style.transform = `translate(-50%, -50%) translate3d(${this.currentX}px, ${limitedY}px, 0) rotate(${rotation}deg) scale(1.0)`;
                });
                
                // 배경색 변경
                document.body.classList.remove('left-active', 'right-active', 'neutral');
                
                if (this.currentX < -50) {
                    document.body.classList.add('left-active');
                } else if (this.currentX > 50) {
                    document.body.classList.add('right-active');
                } else {
                    document.body.classList.add('neutral');
                }
            }

            handleEnd(e) {
                if (!this.isDragging) return;
                
                this.isDragging = false;
                this.photoCard.classList.remove('dragging');
                
                const threshold = 80; // 더 명확한 선택을 위한 임계값
                let selectedAnswer = null;
                
                if (this.currentX < -threshold) {
                    selectedAnswer = '가을';
                    // 햄틱 피드백 추가 (선택 성공)
                    if (navigator.vibrate) {
                        navigator.vibrate(30); // 30ms 진동
                    }
                    this.animateCardExit('left');
                } else if (this.currentX > threshold) {
                    selectedAnswer = '하늘';
                    // 햄틱 피드백 추가 (선택 성공)
                    if (navigator.vibrate) {
                        navigator.vibrate(30); // 30ms 진동
                    }
                    this.animateCardExit('right');
                } else {
                    // 중앙으로 부드럽게 복귀
                    this.photoCard.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    this.photoCard.style.transform = 'translate(-50%, -50%) translate3d(0, 0, 0) rotate(0deg) scale(1.0)';
                    
                    // 배경색 복구
                    document.body.classList.remove('left-active', 'right-active');
                    document.body.classList.add('neutral');
                    
                    setTimeout(() => {
                        this.photoCard.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    }, 400);
                    return;
                }
                
                this.showEmojiExplosion(selectedAnswer);
                
                setTimeout(() => {
                    this.checkAnswer(selectedAnswer);
                }, 300);
            }

            showEmojiExplosion(selectedAnswer) {
                const emojiMap = {
                    '가을': '🍁',
                    '하늘': '☁️'
                };
                
                const emoji = emojiMap[selectedAnswer] || '✨';
                const particleCount = Math.floor(Math.random() * 6) + 20; // 20~25개
                
                // 시작 위치 결정 (왼쪽 또는 오른쪽 끝)
                const startSide = selectedAnswer === '가을' ? 'left' : 'right';
                
                // 파티클들을 저장할 배열
                this.activeParticles = this.activeParticles || [];
                
                for (let i = 0; i < particleCount; i++) {
                    setTimeout(() => {
                        this.createEmojiParticle(emoji, startSide);
                    }, i * 25); // 더 빠르게 순차적으로 나타남 (팡! 효과)
                }
            }

            createEmojiParticle(emoji, startSide) {
                const particle = document.createElement('div');
                particle.className = 'emoji-particle';
                particle.textContent = emoji;
                
                // 랜덤 크기 설정 (24px ~ 72px) - 150% 증가
                const size = Math.floor(Math.random() * 48) + 24;
                particle.style.fontSize = `${size}px`;
                
                // 시작 위치 설정
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                
                let startX, endX;
                if (startSide === 'left') {
                    startX = -50; // 화면 왼쪽 밖
                    endX = Math.random() * (screenWidth * 0.7) + (screenWidth * 0.15); // 화면 중앙 쪽으로
                } else {
                    startX = screenWidth + 50; // 화면 오른쪽 밖
                    endX = Math.random() * (screenWidth * 0.7) + (screenWidth * 0.15); // 화면 중앙 쪽으로
                }
                
                const startY = Math.random() * (screenHeight * 0.3) + (screenHeight * 0.1); // 상단에서 시작
                const fallDistance = Math.random() * 300 + 400; // 400~700px 떨어짐 (더 많이 떨어짐)
                
                particle.style.left = `${startX}px`;
                particle.style.top = `${startY}px`;
                
                // 물리 효과를 위한 커스텀 애니메이션 - 90% 속도로 조정
                const duration = Math.random() * 667 + 889; // 0.89~1.56초 (기존의 90% 속도)
                const horizontalDistance = endX - startX;
                
                // 초기 속도와 감속을 위한 변수들
                const initialVelocity = 2.5; // 초기 속도 배수
                const horizontalInitialVelocity = 1.8; // 수평 초기 속도 배수
                
                particle.style.animation = 'none';
                particle.style.transform = 'translateY(0) rotate(0deg)';
                particle.style.opacity = '1';
                
                document.body.appendChild(particle);
                this.activeParticles.push(particle);
                
                // 물리 엔진 시뮬레이션 - '팡' 효과로 초기 속도가 빠름
                const startTime = Date.now();
                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // 강한 감속 커브 - 초기에 빠르다가 급격히 감속
                    const easeOutCubic = 1 - Math.pow(1 - progress, 3); // 더 강한 감속
                    const easeOutStrong = 1 - Math.pow(1 - progress, 4); // 매우 강한 감속
                    
                    // 수평 이동 (초기에 빠르게 이동 후 급감속)
                    const currentX = startX + horizontalDistance * easeOutStrong;
                    
                    // 수직 이동 (초기에 매우 빠르게 떨어지다가 감속)
                    const verticalProgress = Math.min(progress * initialVelocity, 1);
                    const currentY = startY + fallDistance * (1 - Math.pow(1 - verticalProgress, 2));
                    
                    // 회전 (초기에 빠르게 회전하다가 감속)
                    const rotation = 360 * easeOutCubic * 2; // 더 많이 회전
                    
                    particle.style.left = `${currentX}px`;
                    particle.style.top = `${currentY}px`;
                    particle.style.transform = `rotate(${rotation}deg)`;
                    
                    // 투명도도 중간부터 서서히 사라지게
                    const fadeStart = 0.6; // 60% 지점부터 페이드 시작
                    if (progress > fadeStart) {
                        const fadeProgress = (progress - fadeStart) / (1 - fadeStart);
                        particle.style.opacity = Math.max(0, 1 - fadeProgress);
                    }
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        this.removeParticle(particle);
                    }
                };
                
                requestAnimationFrame(animate);
            }

            removeParticle(particle) {
                if (particle && particle.parentNode) {
                    particle.parentNode.removeChild(particle);
                }
                if (this.activeParticles) {
                    const index = this.activeParticles.indexOf(particle);
                    if (index > -1) {
                        this.activeParticles.splice(index, 1);
                    }
                }
            }

            clearActiveParticles() {
                if (this.activeParticles) {
                    this.activeParticles.forEach(particle => {
                        if (particle && particle.parentNode) {
                            particle.classList.add('dissolve');
                            setTimeout(() => {
                                this.removeParticle(particle);
                            }, 300);
                        }
                    });
                }
            }

            animateCardExit(direction) {
                const exitX = direction === 'left' ? -400 : 400;
                const exitY = Math.random() * 40 - 20; // 약간의 랜덤 Y축 움직임
                const rotation = direction === 'left' ? -20 : 20;
                
                this.photoCard.style.transition = 'all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                this.photoCard.style.transform = `translate(-50%, -50%) translate3d(${exitX}px, ${exitY}px, 0) rotate(${rotation}deg) scale(0.9)`;
                this.photoCard.style.opacity = '0.8';
            }

            checkAnswer(selectedAnswer) {
                const correctAnswer = this.questions[this.currentQuestion].baby;
                
                if (selectedAnswer === correctAnswer) {
                    this.score++;
                }
                
                this.currentQuestion++;
                
                if (this.currentQuestion < this.questions.length) {
                    // Next question
                    setTimeout(async () => {
                        // Clear active particles with dissolve effect
                        this.clearActiveParticles();
                        
                        // Reset background to black
                        document.body.classList.remove('left-active', 'right-active');
                        document.body.classList.add('neutral');
                        
                        // Reset card to center
                        this.photoCard.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                        this.photoCard.style.transform = 'translate(-50%, -50%) translate3d(0, 0, 0) rotate(0deg) scale(1.0)';
                        this.photoCard.style.filter = 'none';
                        this.photoCard.style.opacity = '1';
                        
                        this.updateProgress();
                        await this.loadQuestion();
                    }, 200);
                } else {
                    // Game finished
                    setTimeout(() => {
                        this.showResults();
                    }, 800);
                }
            }

            showResults() {
                // Reset background to black
                document.body.classList.remove('left-active', 'right-active');
                document.body.classList.add('neutral');
                
                this.gameArea.style.display = 'none';
                document.querySelector('.game-screen .header').style.display = 'none';
                document.getElementById('resultsScreen').classList.add('active');
                
                // 점수에 따른 동적 타이틀 설정
                this.updateDynamicTitle();
                
                document.getElementById('scoreMessage').textContent = `${this.score}/12개 맞추셨어요!`;
                
                // 비동기로 점수 저장과 대시보드 업데이트
                this.saveAndUpdateAsync();
            }
            
            async saveAndUpdateAsync() {
                try {
                    // 점수 저장 (비동기)
                    await this.saveScore();
                    
                    // 대시보드 업데이트 (비동기)
                    await this.updateDashboard();
                    
                    // 스크롤 필요 여부에 따른 정렬 조정
                    setTimeout(() => {
                        this.adjustResultsAlignment();
                    }, 100);
                    
                } catch (error) {
                    console.error('📊 랭킹 데이터 처리 오류:', error);
                    // 오류 발생 시 로컬 데이터로만 업데이트
                    const localScores = JSON.parse(localStorage.getItem('all_scores')) || [];
                    this.displayRankings(localScores);
                }
            }
            
            displayRankings(allScores) {
                console.log('🏆 displayRankings called with:', allScores.length, 'scores');
                // 기존 updateDashboard 로직을 분리한 메소드
                
                // gameScore 요소가 없으므로 주석 처리
                // document.getElementById('gameScore').textContent = `${this.score}/3`;
                
                // 순위에 따른 메달 이모지 (점수가 아닌 순위 기준)
                const getMedalEmoji = (position) => {
                    if (position === 0) return '🥇'; // 1등
                    if (position === 1) return '🥈'; // 2등
                    if (position === 2) return '🥉'; // 3등
                    return '';
                };
                
                // 유효한 점수 데이터만 필터링하고 정렬
                const validScores = allScores
                    .filter(entry => typeof entry === 'object' && entry.score !== undefined)
                    .sort((a, b) => {
                        if (b.score !== a.score) {
                            return b.score - a.score; // 점수 내림차순
                        }
                        return b.time.localeCompare(a.time); // 같은 점수면 시간 내림차순 (최신이 앞)
                    });
                
                const rankingContainer = document.getElementById('scoreRanking');
                console.log('📋 Ranking container found:', !!rankingContainer);
                console.log('📊 Valid scores:', validScores.length);
                
                if (validScores.length === 0) {
                    rankingContainer.innerHTML = '<div class="ranking-group"><div class="ranking-item"><div class="ranking-left"><span class="ranking-emoji">📝</span><span class="ranking-score">아직 기록이 없습니다</span></div></div></div>';
                    return;
                }
                
                // 점수별로 그룹핑
                const groupedScores = {};
                validScores.forEach(entry => {
                    if (!groupedScores[entry.score]) {
                        groupedScores[entry.score] = [];
                    }
                    groupedScores[entry.score].push(entry);
                });
                
                // 점수 내림차순으로 정렬된 키들
                const sortedScores = Object.keys(groupedScores).sort((a, b) => b - a);
                
                // 그룹별로 표시 (순위별 메달 적용)
                rankingContainer.innerHTML = sortedScores.map((score, groupIndex) => {
                    const entries = groupedScores[score];
                    const medalEmoji = getMedalEmoji(groupIndex); // 그룹 순서(순위)로 메달 결정
                    
                    // 닉네임들을 콤마로 구분하여 배치 (날짜 정보 제거)
                    const nicknames = entries.map(entry => {
                        return entry.nickname;
                    }).join(', ');
                    
                    return `
                        <div class="ranking-group">
                            <div class="ranking-group-header">
                                <span class="ranking-emoji">${medalEmoji}</span>
                                <span class="ranking-score">${score}개</span>
                            </div>
                            <div class="nicknames-list">
                                <span class="nickname-item">${nicknames}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            adjustResultsAlignment() {
                const resultsContent = document.querySelector('.results-content');
                const resultsScreen = document.getElementById('resultsScreen');
                
                if (resultsContent && resultsScreen) {
                    const contentHeight = resultsContent.scrollHeight;
                    const screenHeight = resultsScreen.clientHeight;
                    
                    if (contentHeight > screenHeight) {
                        // 스크롤이 필요한 경우 상단 정렬
                        resultsContent.style.justifyContent = 'flex-start';
                        resultsContent.style.paddingTop = '20px';
                    } else {
                        // 스크롤이 불필요한 경우 중앙 정렬
                        resultsContent.style.justifyContent = 'center';
                        resultsContent.style.paddingTop = '0';
                    }
                }

            updateDynamicTitle() {

                const scoreRatio = this.score / 12;
                
                if (scoreRatio >= 0.9) {

        // 닉네임 입력 이벤트 설정 함수
        function setupNicknameInput() {
            const nicknameInput = document.getElementById('nicknameInput');
            const startBtn = document.getElementById('startBtn');
            
            // 입력 이벤트 리스너 (닉네임 입력 시 버튼 활성화)
            const handleInput = () => {
                const hasText = nicknameInput.value.trim().length > 0;
                startBtn.disabled = !hasText;
                console.log('📝 Input changed, button enabled:', !startBtn.disabled);
            };
            
            // Enter 키 이벤트
            const handleKeypress = (e) => {
                if (e.key === 'Enter' && !startBtn.disabled) {
                    startGame();
                }
            };
            
            // 기존 이벤트 리스너 제거 후 새로 추가
            nicknameInput.removeEventListener('input', handleInput);
            nicknameInput.removeEventListener('keypress', handleKeypress);
            nicknameInput.addEventListener('input', handleInput);
            nicknameInput.addEventListener('keypress', handleKeypress);
            
            // 초기 상태 설정
            handleInput();
            
            console.log('✅ Nickname input events setup complete');
        }

        // 페이지 로드 이벤트
        window.onload = function() {
            console.log('🎉 Page loaded');
            setupNicknameInput();
        };
